spring:
  application:
    name: jooj
  # 加载 ~/.jooj/.env (用户级 secret 文件,跟 hermes 的 ~/.hermes/.env 一个套路)。
  # JoojEnvBootstrap (EnvironmentPostProcessor) 会在这一步之前确保:
  #   1) ~/.jooj/ 目录存在(POSIX 0700)
  #   2) ~/.jooj/.env 不存在时写入带注释的模板(POSIX 0600)
  # 所以这里 import 一定能命中文件;optional: 是双保险(并发/IO 异常时不爆栈)。
  #
  # 优先级(Spring 默认):OS env / -D 系统属性 > ~/.jooj/.env > application.yml 默认值
  # ${user.home} 是 Spring StandardConfigDataLocationResolver 支持的占位符。
  config:
    import: optional:file:${user.home}/.jooj/.env[.properties]

# Jooj 自定义配置(对应 JoojProperties)。
# 所有占位符 ${ENV:default} 都先看环境变量,再回落到 default。
# 用户可在 ./application.local.yml 或 ~/.claude/jooj/application.yml 里 override。
jooj:
  anthropic:
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    # ANTHROPIC_API_KEY 和 ANTHROPIC_AUTH_TOKEN 二选一(HttpClientConfig 的 httpAuth Bean 会校验)
    api-key: ${ANTHROPIC_API_KEY:}
    auth-token: ${ANTHROPIC_AUTH_TOKEN:}
    model: ${MODEL_ID:}
  compact:
    max-messages: 50
    snip-head-keep: 3
    keep-recent: 3
    min-placeholder-len: 120
    max-tool-result-bytes: 10000
    summary-head-keep: 3
    summary-tail-keep: 10
    summary-max-chars: 500
  memory:
    memory-dir: .memory
    index-filename: MEMORY.md
    max-body-bytes: 4096
    consolidate-threshold: 10
  tasks:
    tasks-dir: .tasks

  # s14 Cron Scheduler 配置。4 层架构:
  #   Layer 1 scheduler thread(scheduler-tick-ms 毫秒轮询匹配 cron)
  #   Layer 3 queue processor thread(processor-tick-ms 毫秒轮询 fired job)
  # durable=true 的 job 保存到 durable-path,jooj 重启后恢复。
  # 默认放在 ~/.jooj/cron/ 下 —— 用户级 schedule 不应跟单个项目的 cwd 绑定
  # (你换个目录起 jooj 不该"丢"已经定的 cron)。
  cron:
    scheduler-tick-ms: 1000
    processor-tick-ms: 200
    durable-path: ${user.home}/.jooj/cron/scheduled_tasks.json

  # s15 Team / MessageBus 配置:文件邮箱目录,每个 agent 一个 <name>.jsonl 文件。
  # s17 加 idle 配置:autonomous teammate IDLE 阶段轮询间隔 + 超时退出。
  # s18 加 worktree-dir:每 task 可绑定一个独立 git worktree 实现并行隔离。
  team:
    mailbox-dir: .mailboxes
    idle-poll-ms: 5000
    idle-timeout-ms: 60000
    worktree-dir: .worktrees

  # 并发 / 线程池配置(线程重构):
  #   scheduler-pool-size — @Scheduled 长期任务池容量(cron scheduler/processor 各占 1)
  #   bg-pool-size — BG 慢工具池(s13);CallerRunsPolicy 满则同步降级
  #   teammate-pool-size — Teammate 池(s15+);AbortPolicy 满则返 Error 给 LLM
  concurrency:
    scheduler-pool-size: 4
    bg-pool-size: 8
    teammate-pool-size: 16

  # s19 MCP plugin —— 真实 SDK 配置(stdio 子进程)
  # 默认 servers 为空(用户配置后才启用真实 SDK,未配置时全部走 mock)
  # 启用真实 server 示例(取消注释 + 加 server 即可):
  #   servers:
  #     filesystem:
  #       command: npx
  #       args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/dir"]
  #     git:
  #       command: npx
  #       args: ["-y", "@modelcontextprotocol/server-git", "--repo", "."]
  mcp:
    startup-timeout-ms: 30000
    call-timeout-ms: 60000
  permission:
    mode: cli   # cli | always-allow | always-deny
  skills:
    dir: skills

  # s10 SYSTEM prompt 片段模板。Assembler 运行期按 context 选段拼接。
  # workspace 不在这里 — 自动从 user.dir 读;memory 正文从 MemoryService 取。
  prompt:
    identity: >
      You are a coding agent.
      Before starting any multi-step task, use todo_write to plan your steps.
      Update task status as you go. Act, don't explain.
    tools: >
      Available tools: bash, read_file, write_file, edit_file, glob,
      todo_write, load_skill, skill_manage, task,
      create_task, list_tasks, get_task, claim_task, complete_task,
      schedule_cron, list_crons, cancel_cron,
      spawn_teammate, send_message, check_inbox,
      create_worktree, remove_worktree, keep_worktree,
      connect_mcp (+ dynamic mcp__server__tool after connect).
      For slow ops (build/test/deploy/install), set bash.run_in_background=true
      to keep working while it runs in the background.
      **Self-improvement:** after completing a complex task (5+ tool calls)
      successfully, after recovering from a hard error, after the user corrected
      your approach, or when you discover a non-trivial workflow worth reusing —
      consider calling skill_manage(action=create) to save a SKILL.md so future
      similar tasks can load_skill instead of re-figuring out the workflow.
      Skills should be reusable patterns, not one-off task notes.
    memory-header: "Memory index (long-term knowledge from past sessions):"

  # s11 错误恢复阈值。RecoveryCoordinator 处理三条路径:
  #   Path 1: max_tokens 截断 → 8K → 64K 升级 → 不行就 continuation prompt(maxRecoveryRetries 次)
  #   Path 2: prompt_too_long → reactive compact 一次
  #   Path 3: 429/529 → 指数退避(base × 2^attempt + 抖动)+ 连续 529 切 fallback
  # 生产场景默认值即可,fallback-model 留空表示不切换。
  recovery:
    max-retries: 10
    base-delay-ms: 500
    max-delay-ms: 32000
    max-consecutive529: 3
    fallback-model: ${FALLBACK_MODEL_ID:}
    default-max-tokens: 8000
    escalated-max-tokens: 64000
    max-recovery-retries: 3
    continuation-prompt: "Your previous response was cut off. Continue from where you left off."

  # s21 Demo 10/11/14: 微信渠道集成。默认 disabled,启用后 sidebar Channels panel 出现入口。
  # token 不在这里配 —— 第一次扫码登录拿到后由 SDK 自管,落 ~/.openclaw/(可用 OPENCLAW_STATE_DIR 改路径)。
  # active accountId 在 ~/.jooj/weixin/state.json,扫码自动写,跨重启自动读(s21 Demo 16.5)。
  # yml 这里**不再有 accountId 字段** —— accountId 是状态不是配置,用户事先不可能知道。
  # 详见笔记 [[jooj_改造日志_s21]] 「⚙️ 接入 weixin」节。
  weixin:
    enabled: ${WEIXIN_ENABLED:true}
    bot-agent: jooj
    dispatch-pool-size: 4               # IM 多 peer 并发度;Demo 14 压测推荐 4
