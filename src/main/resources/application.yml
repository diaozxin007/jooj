spring:
  application:
    name: marvis
  # 兼容老用户的 .env 文件:Spring Boot 4 内置 spring.config.import 支持 dotenv-style 文件,
  # 写成 KEY=value 即可被自动绑定。optional: 让 .env 缺失时不报错,纯环境变量场景仍可启动。
  # 注意:.env 文件需要重命名为 .env.properties 或保持 KEY=value(无 quotes)。
  config:
    import: optional:file:.env[.properties]

# Marvis 自定义配置(对应 MarvisProperties)。
# 所有占位符 ${ENV:default} 都先看环境变量,再回落到 default。
# 用户可在 ./application.local.yml 或 ~/.claude/marvis/application.yml 里 override。
marvis:
  anthropic:
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    # ANTHROPIC_API_KEY 和 ANTHROPIC_AUTH_TOKEN 二选一(HttpClientConfig 的 httpAuth Bean 会校验)
    api-key: ${ANTHROPIC_API_KEY:}
    auth-token: ${ANTHROPIC_AUTH_TOKEN:}
    model: ${MODEL_ID:}
  compact:
    max-messages: 50
    snip-head-keep: 3
    keep-recent: 3
    min-placeholder-len: 120
    max-tool-result-bytes: 10000
    summary-head-keep: 3
    summary-tail-keep: 10
    summary-max-chars: 500
  memory:
    memory-dir: .memory
    index-filename: MEMORY.md
    max-body-bytes: 4096
    consolidate-threshold: 10
  tasks:
    tasks-dir: .tasks

  # s14 Cron Scheduler 配置。4 层架构:
  #   Layer 1 scheduler thread(scheduler-tick-ms 毫秒轮询匹配 cron)
  #   Layer 3 queue processor thread(processor-tick-ms 毫秒轮询 fired job)
  # durable=true 的 job 保存到 durable-path,marvis 重启后恢复。
  cron:
    scheduler-tick-ms: 1000
    processor-tick-ms: 200
    durable-path: .scheduled_tasks.json

  # s15 Team / MessageBus 配置:文件邮箱目录,每个 agent 一个 <name>.jsonl 文件。
  team:
    mailbox-dir: .mailboxes
  permission:
    mode: cli   # cli | always-allow | always-deny
  skills:
    dir: skills

  # s10 SYSTEM prompt 片段模板。Assembler 运行期按 context 选段拼接。
  # workspace 不在这里 — 自动从 user.dir 读;memory 正文从 MemoryService 取。
  prompt:
    identity: >
      You are a coding agent.
      Before starting any multi-step task, use todo_write to plan your steps.
      Update task status as you go. Act, don't explain.
    tools: >
      Available tools: bash, read_file, write_file, edit_file, glob,
      todo_write, load_skill, task,
      create_task, list_tasks, get_task, claim_task, complete_task,
      schedule_cron, list_crons, cancel_cron.
      For slow ops (build/test/deploy/install), set bash.run_in_background=true
      to keep working while it runs in the background.
    memory-header: "Memory index (long-term knowledge from past sessions):"

  # s11 错误恢复阈值。RecoveryCoordinator 处理三条路径:
  #   Path 1: max_tokens 截断 → 8K → 64K 升级 → 不行就 continuation prompt(maxRecoveryRetries 次)
  #   Path 2: prompt_too_long → reactive compact 一次
  #   Path 3: 429/529 → 指数退避(base × 2^attempt + 抖动)+ 连续 529 切 fallback
  # 生产场景默认值即可,fallback-model 留空表示不切换。
  recovery:
    max-retries: 10
    base-delay-ms: 500
    max-delay-ms: 32000
    max-consecutive529: 3
    fallback-model: ${FALLBACK_MODEL_ID:}
    default-max-tokens: 8000
    escalated-max-tokens: 64000
    max-recovery-retries: 3
    continuation-prompt: "Your previous response was cut off. Continue from where you left off."
