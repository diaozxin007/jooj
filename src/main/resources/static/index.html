<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jooj</title>
  <link rel="stylesheet" href="style.css">
  <!--
    Markdown 渲染:marked 解析 → DOMPurify 清洗。
    用 jsDelivr CDN 拉取,无 build step。生产化要内嵌时,用
    `curl -O https://...` 把这两个 .min.js 落盘到 static/vendor/ 即可。
    版本固定:
      - marked@12 是 ESM/UMD 双发,API 与历代兼容(parse / setOptions)
      - DOMPurify@3 是当前主线
  -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.0/dist/purify.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <button id="sidebarToggle" type="button" class="icon-btn" aria-label="切换菜单" title="菜单 (Sessions / Skills / Memory / Channels / 状态)">
        <!-- Hamburger SVG: 3 横线,跟 macOS 习惯一致 -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="18" x2="20" y2="18"/>
        </svg>
      </button>
      <span class="logo">▸</span>
      <span class="title">jooj</span>
      <span class="current-session-tag" id="currentSessionTag" title="当前 session"></span>
    </div>
    <div class="actions">
      <span id="status" class="status idle">idle</span>
      <button id="clearBtn" type="button" title="清空当前 session 的对话历史">清空</button>
    </div>
  </header>

  <!-- 双栏:sidebar 默认收起(.collapsed 由 CSS 控制 transform/translate),
       点击 hamburger 切换 .sidebar-open 在 body 上 -->
  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="信息面板">
      <div class="sidebar-inner">
        <!-- Sessions panel — 放最上面,优先级最高 -->
        <section class="panel">
          <header class="panel-header">
            <h3>Sessions</h3>
            <div class="panel-actions">
              <button class="icon-btn new-session-btn" id="newSessionBtn" type="button" title="新建 session">+</button>
              <button class="icon-btn refresh-btn" data-panel="sessions" type="button" title="刷新">↻</button>
            </div>
          </header>
          <div class="panel-body" id="panel-sessions">
            <p class="panel-loading">加载中...</p>
          </div>
        </section>

        <!-- Skills panel -->
        <section class="panel">
          <header class="panel-header">
            <h3>Skills</h3>
            <button class="icon-btn refresh-btn" data-panel="skills" type="button" title="刷新">↻</button>
          </header>
          <div class="panel-body" id="panel-skills">
            <p class="panel-loading">加载中...</p>
          </div>
        </section>

        <!-- MCP panel (M4, 2026-07-14) -->
        <section class="panel">
          <header class="panel-header">
            <h3>MCP</h3>
            <div class="panel-actions">
              <button class="icon-btn add-btn" id="addMcpBtn" type="button" title="新增 MCP server">+</button>
              <button class="icon-btn refresh-btn" data-panel="mcp" type="button" title="刷新">↻</button>
            </div>
          </header>
          <div class="panel-body" id="panel-mcp">
            <p class="panel-loading">加载中...</p>
          </div>
        </section>

        <!-- Memory panel -->
        <section class="panel">
          <header class="panel-header">
            <h3>Memory</h3>
            <button class="icon-btn refresh-btn" data-panel="memory" type="button" title="刷新">↻</button>
          </header>
          <div class="panel-body" id="panel-memory">
            <p class="panel-loading">加载中...</p>
          </div>
        </section>

        <!-- Channels panel — Demo 11 引入,Demo 15 加 UI 入口 -->
        <section class="panel">
          <header class="panel-header">
            <h3>Channels</h3>
            <button class="icon-btn refresh-btn" data-panel="channels" type="button" title="刷新">↻</button>
          </header>
          <div class="panel-body" id="panel-channels">
            <p class="panel-loading">加载中...</p>
          </div>
        </section>

        <!-- Status panel -->
        <section class="panel">
          <header class="panel-header">
            <h3>运行状态</h3>
            <button class="icon-btn refresh-btn" data-panel="status" type="button" title="刷新">↻</button>
          </header>
          <div class="panel-body" id="panel-status">
            <p class="panel-loading">加载中...</p>
          </div>
        </section>
      </div>
    </aside>

    <main id="messages" aria-live="polite"></main>
  </div>

  <footer>
    <form id="chatForm" autocomplete="off">
      <textarea
        id="queryInput"
        rows="2"
        placeholder="问点什么... (Enter 发送, Shift+Enter 换行)"
        required></textarea>
      <button id="sendBtn" type="submit">发送</button>
      <button id="stopBtn" type="button" title="打断当前 turn" hidden>停止</button>
    </form>
    <p class="hint">
      <span id="historySize">0 条历史</span>
      <span class="dot">·</span>
      <span id="sessionHint">session: default</span>
      <span class="dot">·</span>
      <span id="charCounter" class="char-counter">0 / 2000</span>
    </p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
