# 测试 profile:每个 @SpringBootTest 都通过 @ActiveProfiles("test") 加载这份配置,
# 装配过程不依赖真实 ANTHROPIC_API_KEY/MODEL_ID 系统环境变量,跑测试不需要任何外部条件。
# AnthropicClient 在测试里通过 JoojTestConfig 的 @Primary mock 注入,本文件里的
# api-key/model 仅用于让容器装配通过(HttpAuth Bean 校验非空时不抛)。
spring:
  application:
    name: jooj-test

jooj:
  anthropic:
    base-url: https://api.anthropic.com
    api-key: test-fake-key
    auth-token: ""
    model: test-model
  compact:
    max-messages: 50
    snip-head-keep: 3
    keep-recent: 3
    min-placeholder-len: 120
    max-tool-result-bytes: 10000
    summary-head-keep: 3
    summary-tail-keep: 10
    summary-max-chars: 500
  memory:
    memory-dir: .memory
    index-filename: MEMORY.md
    max-body-bytes: 4096
    consolidate-threshold: 10
  tasks:
    tasks-dir: .tasks
  # s14 测试场景:tick 调小让 cron 测试快速 fire / 处理。
  # 测试场景 durable-path 也指向独立文件,避免污染主 .scheduled_tasks.json。
  cron:
    scheduler-tick-ms: 100
    processor-tick-ms: 50
    durable-path: .scheduled_tasks.test.json
  # s15:测试 profile 用独立目录,避免污染 ./.mailboxes
  # s17:测试 profile 把 idle 调小,让 IDLE 超时退出能在测试时间内发生
  # s18:测试 profile 用独立 worktree 目录
  team:
    mailbox-dir: .mailboxes.test
    idle-poll-ms: 50
    idle-timeout-ms: 200
    worktree-dir: .worktrees.test
  permission:
    mode: always-allow
  skills:
    dir: skills
  # s10 测试场景:用最短的 prompt,保持测试断言简单
  prompt:
    identity: "Test identity. Act, don't explain."
    tools: "Available tools: test stub."
    memory-header: "Memory:"

  # s11 测试场景:激进默认让 backoff 测试在 < 100ms 完成。
  # max-retries=2 + base-delay-ms=10 → 即使重试满都几十毫秒。
  # fallback-model 留空,需要测 fallback 切换的测试用例自己 override。
  recovery:
    max-retries: 2
    base-delay-ms: 10
    max-delay-ms: 50
    max-consecutive529: 2
    fallback-model: ""
    default-max-tokens: 8000
    escalated-max-tokens: 64000
    max-recovery-retries: 3
    continuation-prompt: "Continue."
